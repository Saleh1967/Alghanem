name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: python tools/regen_all.py --check
      # القانونُ المركزيّ يُشغَّل وحدَه أوّلًا ليُرى خرقُه باسمه لا مختلطًا بغيره.
      - name: deposit law (gates must hold across the whole tree)
        run: python -c "from alghanem.deposit_law import assert_the_gates_hold; assert_the_gates_hold()"
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
