name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: Re-derive the MASAQ witnesses from the deposited bytes
        run: |
          if [ -f corpora/MASAQ.csv ]; then
            python examples/arabic/rederive_masaq_witnesses.py
          else
            echo "SKIPPED: corpora/MASAQ.csv is absent, so the twenty MASAQ figures were not re-derived in this run."
            echo "This step is skipped out loud, never silently: a missing deposit is a missing measurement, not a pass."
          fi
