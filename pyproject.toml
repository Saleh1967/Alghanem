[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "alghanem"
version = "0.2.0"
description = "A116: the sealed gate from bytes to cells and back, with its Lean proof"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.10.0",
    "pytest==8.2.2",
    "ruff==0.6.9",
]

# المدخلُ الوحيدُ والمخرجُ الوحيد: حزمةُ `gate`. ولا تُنصَّب `suspended/` أبدًا.
[tool.setuptools]
packages = ["gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: يقيس على مرجعٍ بشريٍّ محجوب (MASAQ) ويطول؛ `-m \"not slow\"` للسريع",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["suspended", "formal"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["gate/api.py", "gate/guard.py", "gate/licence.py"]

[[tool.mypy.overrides]]
module = "gate.contextual"
ignore_errors = true
