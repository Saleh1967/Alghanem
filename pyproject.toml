[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slge"
version = "0.3.0"
description = "SLGE: محرّك عربيّ أبيض الصندوق — من البتّ إلى الجواب، وكلُّ سطرٍ بوسم برهانه"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
markers = ["slow: استقصاءٌ أوسع من ميزانية الاختبار اليوميّة (يجري في CI)"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "tools"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["suspended"]  # معلَّقٌ لا يُنصَّب ولا يُفحَص حتى يعود عبر المدخل

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# النصوصُ العربيّة ليست «محارفَ ملتبسة».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["slge", "conftest", "world_fixture"]
